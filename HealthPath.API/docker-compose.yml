# Chạy từ thư mục HealthPath.API:
#   docker compose up --build
# Hoặc từ root repo:
#   docker compose -f HealthPath.API/docker-compose.yml up --build

services:
  healthpath-backend:
    build:
      context: ..
      dockerfile: HealthPath.API/Dockerfile
    container_name: test-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres-db;Port=5432;Database=healthpath;Username=postgres;Password=1234567890
      Jwt__Key: CaiChiaKhoaBaoMatTuyetDoi123456789
    depends_on:
      postgres-db:
        condition: service_healthy

  postgres-db:
    image: postgres:15-alpine
    container_name: postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1234567890"
      POSTGRES_DB: healthpath
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d healthpath"]
      interval: 2s
      timeout: 5s
      retries: 10
